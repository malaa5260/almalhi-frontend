<footer class="border-t border-gray-200 bg-white">
  <div class="mx-auto max-w-480 px-4 py-8 sm:px-6 lg:px-8">
    <div class="flex flex-col justify-between gap-6 md:flex-row md:items-center">
      <div>
        <div class="flex items-center gap-3 text-[#1C585C]">
          <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-[#2F959C] text-white">
            <i class="fa-solid fa-layer-group"></i>
          </span>

          <span class="text-lg font-bold">
            {{ title() }}
          </span>
        </div>

        <p class="mt-3 max-w-md text-sm leading-6 text-gray-500">
          Scalable Angular Nx Monorepo with reusable UI components.
        </p>
      </div>

      <nav class="flex flex-wrap gap-3">
        @for (link of links(); track link.path) {
        <a [routerLink]="link.path"
          class="rounded-lg px-3 py-2 text-sm font-medium text-gray-600 transition hover:bg-[#2F959C]/10 hover:text-[#2F959C]">
          {{ link.label }}
        </a>
        }
      </nav>
    </div>

    <div class="mt-8 border-t border-gray-100 pt-5 text-sm text-gray-500">
      © {{ currentYear }} {{ title() }}. All rights reserved.
    </div>
  </div>
</footer>
