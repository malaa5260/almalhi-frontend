<button [type]="type()" [disabled]="disabled() || loading()" (click)="onClick()"
  class="relative inline-flex items-center justify-center rounded-xl font-medium transition-all duration-200 disabled:cursor-not-allowed disabled:opacity-50 cursor-pointer"
  [class.w-full]="fullWidth()" [class.px-3]="size() === 'sm'" [class.py-2]="size() === 'sm'"
  [class.text-sm]="size() === 'sm'" [class.px-5]="size() === 'md'" [class.py-2.5]="size() === 'md'"
  [class.text-base]="size() === 'md'" [class.px-6]="size() === 'lg'" [class.py-3]="size() === 'lg'"
  [class.text-lg]="size() === 'lg'" [class.bg-[#2F959C]]="variant() === 'primary'"
  [class.text-white]="variant() === 'primary'" [class.hover:bg-[#247479]]="variant() === 'primary'"
  [class.bg-gray-100]="variant() === 'secondary'" [class.text-gray-800]="variant() === 'secondary'"
  [class.hover:bg-gray-200]="variant() === 'secondary'" [class.border]="variant() === 'outline'"
  [class.border-[#2F959C]]="variant() === 'outline'" [class.text-[#2F959C]]="variant() === 'outline'"
  [class.hover:bg-[#2F959C]/10]="variant() === 'outline'" [class.text-gray-700]="variant() === 'ghost'"
  [class.hover:bg-gray-100]="variant() === 'ghost'" [class.hover:scale-[1.02]]="!disabled() && !loading()"
  [class.active:scale-[0.98]]="!disabled() && !loading()">
  @if (loading()) {
  <span class="flex items-center gap-2">
    <span class="h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"></span>
    Loading...
  </span>
  } @else {
  <span class="flex items-center gap-2">
    <!-- start Icon -->
    @if(icon() && iconPosition() === 'start') {
    <i [class]="icon()"></i>
    }
    {{ label() }}
    <!-- end Icon -->
    @if(icon() && iconPosition() === 'end') {
    <i [class]="icon()"></i>
    }
  </span>
  }
</button>
