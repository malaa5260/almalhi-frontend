<div class="fixed top-5 inset-e-5 z-50 flex flex-col gap-3">
  @for (toast of toastService.toasts(); track toast.id) {
  <div
    class="min-w-62.5 flex items-start justify-between gap-3 rounded-xl px-4 py-3 text-white shadow-lg transition-all duration-300"
    [class.bg-green-500]="toast.type === 'success'"
    [class.bg-red-500]="toast.type === 'error'"
    [class.bg-blue-500]="toast.type === 'info'">

    <!-- Message -->
    <span class="flex-1 text-sm">
      {{ toast.message }}
    </span>

    <!-- Close Button -->
    <button
      (click)="close(toast.id)"
      class="text-white/80 hover:text-white transition text-lg leading-none">
      ✕
    </button>

  </div>
  }
</div>
