<header class="fixed top-0 left-0 z-50 w-full border-b border-gray-200 bg-white/90 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-480 items-center justify-between px-4 sm:px-6 lg:px-8">

    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-3 text-[#1C585C]" (click)="closeMobileMenu()">
      <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-[#2F959C] text-white">
        <i class="fa-solid fa-layer-group"></i>
      </span>

      <span class="text-xl font-bold">
        {{ title() }}
      </span>
    </a>

    <!-- Nav -->
    <nav class="hidden items-center gap-2 md:flex">
      @for (item of navItems(); track item.path) {
      <a [routerLink]="item.path" routerLinkActive="bg-[#2F959C]/10 text-[#2F959C]"
        [routerLinkActiveOptions]="{ exact: item.path === '/' }"
        class="inline-flex items-center gap-2 rounded-xl px-4 py-2 text-lg font-medium text-gray-600 transition hover:bg-[#2F959C]/10 hover:text-[#2F959C]">
        @if (item.icon) {
        <i [class]="item.icon"></i>
        }
        {{ item.label }}
      </a>
      }
    </nav>

    <button type="button"
      class="inline-flex h-10 w-10 items-center justify-center rounded-xl text-[#1C585C] transition hover:bg-[#2F959C]/10 md:hidden"
      [attr.aria-expanded]="isMobileMenuOpen()" aria-label="Toggle menu" (click)="toggleMobileMenu()">
      @if (isMobileMenuOpen()) {
      <i class="fa-solid fa-xmark text-xl"></i>
      } @else {
      <i class="fa-solid fa-bars text-xl"></i>
      }
    </button>
  </div>

  @if (isMobileMenuOpen()) {
  <div class="border-t border-gray-100 bg-white md:hidden">
    <nav class="mx-auto flex max-w-7xl flex-col gap-1 px-4 py-4 sm:px-6">
      @for (item of navItems(); track item.path) {
      <a [routerLink]="item.path" routerLinkActive="bg-[#2F959C]/10 text-[#2F959C]"
        [routerLinkActiveOptions]="{ exact: item.path === '/' }"
        class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-gray-600 transition hover:bg-[#2F959C]/10 hover:text-[#2F959C]"
        (click)="closeMobileMenu()">
        @if (item.icon) {
        <i [class]="item.icon"></i>
        }
        {{ item.label }}
      </a>
      }
    </nav>
  </div>
  }
</header>
