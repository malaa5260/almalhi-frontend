<section class="grid min-h-[calc(100vh-220px)] items-center gap-10 py-10 lg:grid-cols-2">
  <div class="hidden lg:block">
    <span class="mb-4 inline-flex rounded-full bg-[#2F959C]/10 px-4 py-2 text-sm font-semibold text-[#2F959C]">
      Reset Password
    </span>

    <h1 class="text-4xl font-bold leading-tight text-[#1C585C] md:text-5xl">
      Set a new password
    </h1>

    <p class="mt-6 max-w-xl text-lg leading-8 text-gray-600">
      Your new password must be different from previously used passwords.
    </p>
  </div>

  <almalhi-card padding="lg">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-[#2F959C] text-white">
        <i class="fa-solid fa-lock text-xl"></i>
      </div>

      <h2 class="text-2xl font-bold text-[#1C585C]">Reset password</h2>
      <p class="mt-2 text-sm text-gray-500">Enter your new password below.</p>
    </div>

    <form class="grid gap-5" [formGroup]="form" (ngSubmit)="submit()">
      <almalhi-input label="New password" type="password" formControlName="password" [required]="true"
        [error]="passwordError" />

      <almalhi-input label="Confirm password" type="password" formControlName="confirmPassword" [required]="true"
        [error]="confirmPasswordError" />

      <almalhi-button label="Reset password" type="submit" [fullWidth]="true" [loading]="isSubmitting" />

      <p class="text-center text-sm text-gray-600">
        Back to
        <a routerLink="/auth/login" class="font-semibold text-[#2F959C] hover:underline">
          login
        </a>
      </p>
    </form>
  </almalhi-card>
</section>
