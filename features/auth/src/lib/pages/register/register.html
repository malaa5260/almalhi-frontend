<section class="grid min-h-[calc(100vh-220px)] items-center gap-10 py-10 lg:grid-cols-2">
  <div class="hidden lg:block">
    <span class="mb-4 inline-flex rounded-full bg-[#A89333]/10 px-4 py-2 text-sm font-semibold text-[#A89333]">
      Create Account
    </span>

    <h1 class="text-4xl font-bold leading-tight text-[#1C585C] md:text-5xl">
      Start building with Almalhi platform
    </h1>

    <p class="mt-6 max-w-xl text-lg leading-8 text-gray-600">
      Create your account and access a clean Angular Nx architecture with reusable UI and scalable features.
    </p>
  </div>

  <almalhi-card padding="lg">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-[#2F959C] text-white">
        <i class="fa-solid fa-user-plus text-xl"></i>
      </div>

      <h2 class="text-2xl font-bold text-[#1C585C]">Create account</h2>
      <p class="mt-2 text-sm text-gray-500">Fill in your details to continue.</p>
    </div>

    <form class="grid gap-5" [formGroup]="form" (ngSubmit)="register()">
      <almalhi-input label="Full name" placeholder="Enter your full name" formControlName="fullName"
        [error]="fullNameError" />

      <almalhi-input label="Email" type="email" placeholder="Enter your email" formControlName="email"
        [error]="emailError" />

      <almalhi-input label="Password" type="password" placeholder="Enter your password" formControlName="password"
        [error]="passwordError" />

      <almalhi-input label="Confirm password" type="password" placeholder="Confirm your password"
        formControlName="confirmPassword" [error]="confirmPasswordError" />

      <almalhi-button label="Create account" type="submit" [fullWidth]="true" [loading]="isSubmitting" />

      <p class="text-center text-sm text-gray-600">
        Already have an account?
        <a routerLink="/auth/login" class="font-semibold text-[#2F959C] hover:underline">
          Sign in
        </a>
      </p>
    </form>
  </almalhi-card>
</section>
