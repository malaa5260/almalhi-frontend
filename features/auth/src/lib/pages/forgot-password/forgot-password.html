<section class="grid min-h-[calc(100vh-220px)] items-center gap-10 py-10 lg:grid-cols-2">
  <div class="hidden lg:block">
    <span class="mb-4 inline-flex rounded-full bg-[#2F959C]/10 px-4 py-2 text-sm font-semibold text-[#2F959C]">
      Password Recovery
    </span>

    <h1 class="text-4xl font-bold leading-tight text-[#1C585C] md:text-5xl">
      Recover your account securely
    </h1>

    <p class="mt-6 max-w-xl text-lg leading-8 text-gray-600">
      Enter your email address and we will send you a verification code to reset your password.
    </p>
  </div>

  <almalhi-card padding="lg">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-[#2F959C] text-white">
        <i class="fa-solid fa-key text-xl"></i>
      </div>

      <h2 class="text-2xl font-bold text-[#1C585C]">Forgot password?</h2>
      <p class="mt-2 text-sm text-gray-500">
        Enter your email to receive a verification code.
      </p>
    </div>

    <form class="grid gap-5" [formGroup]="form" (ngSubmit)="submit()">
      <almalhi-input label="Email" type="email" placeholder="Enter your email" formControlName="email"
        [error]="emailError"   [required]="true"/>

      <almalhi-button label="Send verification code" type="submit" [fullWidth]="true" [loading]="isSubmitting" />

      <p class="text-center text-sm text-gray-600">
        Remember your password?
        <a routerLink="/auth/login" class="font-semibold text-[#2F959C] hover:underline">
          Back to login
        </a>
      </p>
    </form>
  </almalhi-card>
</section>
