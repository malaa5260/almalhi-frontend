<div class="space-y-6">

  <!-- Header -->
  <div>
    <h1 class="text-3xl font-bold text-[#1C585C]">Dashboard</h1>
    <p class="text-gray-600">Welcome back 👋</p>
  </div>

  <!-- Stats -->
  <div class="grid gap-4 md:grid-cols-3">
    @for (item of stats; track item.title) {
      <almalhi-card padding="md" [hover]="true">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm text-gray-500">{{ item.title }}</p>
            <h3 class="text-2xl font-bold text-[#1C585C]">
              {{ item.value }}
            </h3>
          </div>

          <span
            class="flex h-12 w-12 items-center justify-center rounded-xl text-white"
            [style.background]="item.color"
          >
            <i [class]="item.icon"></i>
          </span>
        </div>
      </almalhi-card>
    }
  </div>

  <!-- Activity -->
  <almalhi-card padding="lg">
    <h2 class="mb-4 text-xl font-bold text-[#1C585C]">
      Recent Activity
    </h2>

    <div class="space-y-3">
      @for (item of activities; track item.title) {
        <div class="flex items-center justify-between rounded-lg bg-gray-50 px-4 py-3">
          <span class="text-gray-700">{{ item.title }}</span>
          <span class="text-sm text-gray-400">{{ item.time }}</span>
        </div>
      }
    </div>
  </almalhi-card>

</div>
